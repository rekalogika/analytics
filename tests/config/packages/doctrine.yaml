doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: "%kernel.project_dir%/src/App/Entity"
                prefix: 'Rekalogika\Analytics\Tests\App\Entity'
                alias: App